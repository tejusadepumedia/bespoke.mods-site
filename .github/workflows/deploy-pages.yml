name: Publish GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out compiled site
        uses: actions/checkout@v4

      - name: Stage public files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/site"
          rsync --archive --delete --exclude='.git/' --exclude='.github/' \
            ./ "$RUNNER_TEMP/site/"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/site

  # Deploying in its own job gives the uploaded artifact time to be registered. GitHub's
  # artifact lookup still occasionally answers "No artifacts named github-pages were found",
  # so a failed first attempt waits and tries once more before the run is marked failed.
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Deploy Pages artifact
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before retrying
        if: steps.deployment.outcome == 'failure'
        run: sleep 30

      - name: Retry Pages deployment
        id: retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
